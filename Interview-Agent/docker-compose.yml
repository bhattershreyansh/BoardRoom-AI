version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: boardroom_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: always

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: boardroom_agent
    env_file:
      - ../.env
    depends_on:
      - api
    restart: always
