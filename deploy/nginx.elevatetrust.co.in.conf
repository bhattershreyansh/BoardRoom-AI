# Add this file to the elevatetrust Nginx config directory, then reload nginx.
# Requires boardroom_api and boardroom_frontend on the elevatetrust_default network.
#
#   docker exec elevatetrust-nginx-1 nginx -t
#   docker exec elevatetrust-nginx-1 nginx -s reload

server {
    listen 80;
    server_name elevatetrust.co.in www.elevatetrust.co.in;

    location /api {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /health {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://boardroom_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
