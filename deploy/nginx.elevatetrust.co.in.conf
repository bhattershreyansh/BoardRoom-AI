# BoardRoom AI — elevatetrust.co.in (separate from elevatetrust.in)

server {
    listen 80;
    server_name elevatetrust.co.in www.elevatetrust.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name elevatetrust.co.in www.elevatetrust.co.in;

    ssl_certificate /etc/letsencrypt/live/elevatetrust.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elevatetrust.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.elevatetrust.co.in) {
        return 301 https://elevatetrust.co.in$request_uri;
    }

    location /api {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /health {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://boardroom_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
