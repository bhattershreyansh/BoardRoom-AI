# BoardRoom AI — elevatetrust.co.in (separate from elevatetrust.in)
# Copy to: /opt/elevatetrust/nginx/conf.d/elevatetrust.co.in.conf
#
#   sudo cp ~/BoardRoom-AI/deploy/nginx.elevatetrust.co.in.conf /opt/elevatetrust/nginx/conf.d/
#   docker exec elevatetrust-nginx-1 nginx -t
#   docker exec elevatetrust-nginx-1 nginx -s reload
#
# Requires SSL cert for elevatetrust.co.in (see README in deploy/ or comments below).

# HTTP — certbot + redirect to HTTPS
server {
    listen 80;
    server_name elevatetrust.co.in www.elevatetrust.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — BoardRoom frontend + API
server {
    listen 443 ssl;
    server_name elevatetrust.co.in www.elevatetrust.co.in;

    ssl_certificate /etc/letsencrypt/live/elevatetrust.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elevatetrust.co.in/privkey.pem;

    location /api {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /health {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://boardroom_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
