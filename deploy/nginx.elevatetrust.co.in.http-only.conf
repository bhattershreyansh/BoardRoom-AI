# STEP 1 — Use this FIRST to obtain the SSL certificate (nginx -t works without cert files).
# Copy to: /opt/elevatetrust/nginx/conf.d/elevatetrust.co.in.conf
#
#   sudo cp ~/BoardRoom-AI/deploy/nginx.elevatetrust.co.in.http-only.conf /opt/elevatetrust/nginx/conf.d/elevatetrust.co.in.conf
#   docker exec elevatetrust-nginx-1 nginx -t && docker exec elevatetrust-nginx-1 nginx -s reload
#
# Then run certbot (see deploy/CERTBOT.md or commands below).
# After cert is issued, replace with nginx.elevatetrust.co.in.conf (HTTPS version).

server {
    listen 80;
    server_name elevatetrust.co.in www.elevatetrust.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /health {
        proxy_pass http://boardroom_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://boardroom_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
